<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NathChat — Messagerie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── tokens ── */
    :root {
      --paper: #f7f5f0;
      --ink: #141418;
      --ink-soft: #5a5a66;
      --rule: #d8d4c8;
      --border: #c7c2b5;
      --surface: #ffffff;
      --surface2: #f3f1e8;
      --credit: #2e7d32;
      --debit: #b3261e;
      --accent: #5a4a2e;
    }

    /* ── reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 17px;
      line-height: 1.55;
      overflow: hidden;
    }

    /* ── type ── */
    h1 { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 1.5rem; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 0.4em; }
    h2 { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 1.1rem; line-height: 1.25; margin-bottom: 0.5em; }
    p { margin-bottom: 1em; }
    small { font-size: 0.85rem; color: var(--ink-soft); }
    code { font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; background: #eaddc4; padding: 0.1em 0.35em; border: 1px solid var(--rule); }
    a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
    a:hover { color: #5a4a2e; }
    a:focus-visible { outline: 2px solid #5a4a2e; outline-offset: 2px; }

    /* ── layout ── */
    #app { display: none; }
    #app.visible { display: flex; }
    #app { height: 100vh; }

    /* ── login ── */
    #login-screen {
      position: fixed; inset: 0; background: var(--paper);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    #login-screen.hidden { display: none; }
    .login-box { border: 2px solid var(--ink); background: #ffffff; padding: 2rem; max-width: 400px; width: 90%; }
    .login-box h1 { margin-bottom: 0.25rem; }
    .login-sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 1.5rem; }
    .login-box fieldset { border: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.75rem; }
    .field { display: flex; flex-direction: column; gap: 0.4rem; }
    .field label { font-size: 0.8rem; letter-spacing: 0.08em; color: var(--ink-soft); }
    .field input { background: #ffffff; border: 1px solid var(--border); color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 0.95rem; padding: 0.55rem 0.7rem; outline: none; width: 100%; }
    .field input:focus { border-color: var(--ink); }
    button { background: var(--ink); color: #ffffff; border: none; padding: 0.6rem 1rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; letter-spacing: 0.1em; cursor: pointer; margin-top: 0.5rem; }
    button:hover { background: #000; }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--border); }
    button.secondary:hover { background: #eaddc4; border-color: var(--ink); }
    .message { font-size: 0.85rem; padding: 0.5rem 0.75rem; margin-top: 0.5rem; border: 1px solid var(--border); display: none; }
    .message.show { display: block; }
    .message.error { border-color: #b3261e; background: #f9f0f0; color: #b3261e; }

    /* ── sidebar ── */
    #sidebar { width: 260px; min-width: 260px; background: var(--surface); border-right: 1px solid var(--rule); display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-head { padding: 1rem; border-bottom: 1px solid var(--rule); }
    .sidebar-head h1 { font-size: 1.1rem; margin-bottom: 0.25rem; }
    .user-pill { display: flex; align-items: center; gap: 0.5rem; border: 1px solid var(--rule); padding: 0.5rem; margin-bottom: 1rem; }
    .avatar { width: 26px; height: 26px; background: var(--ink); color: #ffffff; border-radius: 0; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; flex-shrink: 0; }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-status { font-size: 0.7rem; color: var(--credit); display: flex; align-items: center; gap: 0.2rem; }
    .status-dot { width: 5px; height: 5px; background: var(--credit); border-radius: 0; }
    button.btn-logout { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 1rem; padding: 0.2rem; margin-left: auto; }
    button.btn-logout:hover { color: #b3261e; }

    .sidebar-section { padding: 0.75rem 1rem; flex: 1; overflow-y: auto; }
    .section-label { font-size: 0.75rem; letter-spacing: 0.08em; color: var(--ink-soft); margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
    .btn-add-room { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 1rem; padding: 0.2rem; }
    .btn-add-room:hover { color: var(--ink); }

    .room-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; border-radius: 0; cursor: pointer; color: var(--ink-soft); font-size: 0.9rem; }
    .room-item:hover { background: var(--surface2); color: var(--ink); }
    .room-item.active { background: #eaddc4; color: var(--ink); font-weight: 600; border-left: 3px solid var(--ink); padding-left: calc(0.75rem - 3px); }
    .room-hash { font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; opacity: 0.6; }

    .sidebar-online { padding: 0.75rem 1rem; border-top: 1px solid var(--rule); }
    .online-list { display: flex; flex-direction: column; gap: 0.3rem; margin-top: 0.5rem; max-height: 140px; overflow-y: auto; }
    .online-user { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0.5rem; border-radius: 0; font-size: 0.8rem; color: var(--ink-soft); }
    .online-avatar { width: 20px; height: 20px; background: var(--ink); color: #ffffff; border-radius: 0; font-size: 0.7rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    /* ── main chat ── */
    #chat-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .chat-header { padding: 0 1rem; height: 56px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 0.5rem; background: var(--surface); flex-shrink: 0; }
    .chat-room-name { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 0.4rem; }
    .chat-header-sep { flex: 1; }
    .online-badge { font-size: 0.75rem; color: var(--credit); border: 1px solid var(--rule); padding: 0.2rem 0.6rem; display: flex; align-items: center; gap: 0.3rem; }

    #messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); }

    .msg-group { display: flex; gap: 0.5rem; padding: 0.4rem 0.6rem; border-radius: 0; position: relative; }
    .msg-group:hover { background: var(--surface2); }
    .msg-avatar { width: 30px; height: 30px; background: var(--ink); color: #ffffff; border-radius: 0; flex-shrink: 0; font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
    .msg-body { flex: 1; min-width: 0; }
    .msg-meta { display: flex; align-items: baseline; gap: 0.4rem; margin-bottom: 0.2rem; }
    .msg-author { font-size: 0.85rem; font-weight: 600; color: var(--ink); }
    .msg-author.self { color: var(--credit); }
    .msg-time { font-size: 0.7rem; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; }
    .msg-text { font-size: 0.9rem; color: var(--ink); line-height: 1.6; word-break: break-word; }
    .msg-reactions { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.3rem; }
    .reaction-pill { display: flex; align-items: center; gap: 0.2rem; background: #ffffff; border: 1px solid var(--border); border-radius: 0; padding: 0.15rem 0.5rem; font-size: 0.8rem; cursor: pointer; color: var(--ink-soft); }
    .reaction-pill:hover { border-color: var(--ink); color: var(--ink); }
    .msg-actions { position: absolute; right: 0.6rem; top: 0.4rem; opacity: 0; display: flex; gap: 0.2rem; background: #ffffff; border: 1px solid var(--border); padding: 0.2rem 0.4rem; }
    .msg-group:hover .msg-actions { opacity: 1; }
    .action-btn { background: none; border: none; cursor: pointer; padding: 0.2rem 0.4rem; border-radius: 0; font-size: 0.9rem; color: var(--ink-soft); }
    .action-btn:hover { color: var(--ink); background: var(--surface2); }

    .msg-system { text-align: center; font-size: 0.75rem; color: var(--ink-soft); padding: 0.4rem; font-style: italic; }

    #typing-indicator { height: 20px; padding: 0 1rem; font-size: 0.75rem; color: var(--ink-soft); font-style: italic; }

    /* ── input ── */
    .chat-input-zone { padding: 0.75rem 1rem 1rem; border-top: 1px solid var(--rule); background: var(--surface); flex-shrink: 0; }
    .input-bar { display: flex; align-items: center; gap: 0.5rem; background: #ffffff; border: 1px solid var(--border); padding: 0.45rem 0.7rem; border-radius: 0; }
    .input-bar:focus-within { border-color: var(--ink); }
    #msg-input { flex: 1; background: none; border: none; outline: none; font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; color: var(--ink); resize: none; max-height: 120px; line-height: 1.6; }
    #msg-input::placeholder { color: var(--ink-soft); }
    .btn-send { background: var(--ink); border: none; border-radius: 0; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .btn-send:hover { background: #000; }

    /* ── welcome ── */
    #welcome-screen { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 0.75rem; color: var(--ink-soft); }
    .welcome-icon { font-size: 3rem; opacity: 0.5; }
    .welcome-text { font-size: 0.9rem; }

    /* ── modal ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(20,20,24,0.25); display: none; align-items: center; justify-content: center; z-index: 200; }
    .modal-overlay.open { display: flex; }
    .modal { background: #ffffff; border: 2px solid var(--ink); padding: 1.5rem; width: 100%; max-width: 340px; position: relative; }
    .modal-head { border-bottom: 1px solid var(--rule); padding-bottom: 0.5rem; margin-bottom: 1rem; }
    .modal-title { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 1.1rem; }
    .modal input { width: 100%; border: 1px solid var(--border); padding: 0.45rem 0.7rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; margin-bottom: 0.75rem; }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }

    /* ── emoji picker ── */
    .emoji-picker { position: absolute; background: #ffffff; border: 1px solid var(--border); padding: 0.4rem; z-index: 10; display: flex; gap: 0.3rem; }
    .emoji-picker button { background: none; border: none; font-size: 1rem; cursor: pointer; padding: 0.3rem; }
    .emoji-picker button:hover { background: var(--surface2); }

    @media (max-width: 700px) { #sidebar { width: 200px; min-width: 200px; } }
    @media (max-width: 550px) { #app { flex-direction: column; } #sidebar { width: 100%; height: 35%; border-right: none; border-bottom: 1px solid var(--rule); } #chat-main { height: 65%; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>

  <!-- login -->
  <div id="login-screen">
    <div class="login-box">
      <h1>NathChat</h1>
      <div class="login-sub">connectez-vous avec votre compte nathbank</div>
      <fieldset>
        <div class="field">
          <label>nom d'utilisateur</label>
          <input type="text" id="login-user" placeholder="ton_pseudo">
        </div>
        <div class="field">
          <label>mot de passe</label>
          <input type="password" id="login-pass" placeholder="••••••••">
        </div>
      </fieldset>
      <div id="login-error" class="message error"></div>
      <button type="button" id="btn-login" onclick="doLogin()">se connecter</button>
      <div style="font-size:0.8rem;color:var(--ink-soft);margin-top:1rem;text-align:center;">
        pas de compte ? <a href="http://localhost:3000" target="_blank">créer un compte nathbank</a>
      </div>
    </div>
  </div>

  <!-- app -->
  <div id="app" class="hidden">
    <!-- sidebar -->
    <div id="sidebar">
      <div class="sidebar-head">
        <h1>NathChat</h1>
      </div>
      <div class="user-pill">
        <div class="avatar" id="user-avatar">?</div>
        <div class="user-info">
          <div class="user-name" id="user-display-name">—</div>
          <div class="user-status"><div class="status-dot"></div> en ligne</div>
        </div>
        <button class="btn-logout" onclick="doLogout()" title="déconnexion">✕</button>
      </div>
      <div class="sidebar-section">
        <div class="section-label">
          salons
          <button class="btn-add-room" onclick="showAddRoom()" title="nouveau salon">＋</button>
        </div>
        <div id="room-list"></div>
      </div>
      <div class="sidebar-online">
        <div style="font-size:0.75rem;letter-spacing:0.08em;color:var(--ink-soft);margin-bottom:0.4rem;">en ligne <span id="online-count">0</span></div>
        <div class="online-list" id="online-list"></div>
      </div>
    </div>

    <!-- main -->
    <div id="chat-main">
      <div id="welcome-screen">
        <div class="welcome-icon">💬</div>
        <div class="welcome-text">sélectionnez un salon pour commencer</div>
      </div>

      <div id="chat-view" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
        <div class="chat-header">
          <div class="chat-room-name">
            <span class="room-hash">#</span>
            <span id="chat-room-title">général</span>
          </div>
          <div class="chat-header-sep"></div>
          <div class="online-badge">
            <div class="status-dot"></div>
            <span id="online-badge-count">0</span> en ligne
          </div>
        </div>

        <div id="messages"></div>
        <div id="typing-indicator"></div>

        <div class="chat-input-zone">
          <div class="input-bar">
            <textarea id="msg-input" rows="1" placeholder="envoyer un message…"></textarea>
            <button class="btn-send" onclick="sendMessage()">
              <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- modal nouveau salon -->
  <div class="modal-overlay" id="modal-room">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><div class="modal-title">nouveau salon</div></div>
      <input type="text" class="modal-input" id="new-room-name" placeholder="nom-du-salon">
      <div class="modal-actions">
        <button type="button" class="secondary" onclick="hideAddRow()">annuler</button>
        <button type="button" onclick="createRoom()">créer</button>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:3002';
    const WS_URL = 'ws://localhost:3002';
    const EMOJIS = ['👍','❤️','😂','😮','😢','🔥'];

    let ws = null;
    let token = localStorage.getItem('nathchat_token');
    let currentUser = JSON.parse(localStorage.getItem('nathchat_user') || 'null');
    let currentRoomId = null;
    let typingTimeout = null;

    if (token && currentUser) {
      showApp();
      connectWS();
    }

    async function doLogin() {
      const username = document.getElementById('login-user').value.trim();
      const password = document.getElementById('login-pass').value;
      const btn = document.getElementById('btn-login');
      const err = document.getElementById('login-error');
      if (!username || !password) { err.textContent = 'remplissez tous les champs'; err.className = 'message error show'; return; }
      btn.disabled = true; btn.textContent = 'connexion…'; err.className = 'message error';
      try {
        const res = await fetch('http://localhost:3000/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) { err.textContent = data.error || 'identifiants incorrects'; err.className = 'message error show'; btn.disabled = false; btn.textContent = 'se connecter'; return; }
        token = data.token;
        currentUser = { userId: data.userId || data.id, username: data.username || username };
        localStorage.setItem('nathchat_token', token);
        localStorage.setItem('nathchat_user', JSON.stringify(currentUser));
        showApp();
        connectWS();
      } catch (e) {
        err.textContent = 'impossible de contacter nathbank (port 3000)';
        err.className = 'message error show';
        btn.disabled = false; btn.textContent = 'se connecter';
      }
    }

    function doLogout() {
      localStorage.removeItem('nathchat_token');
      localStorage.removeItem('nathchat_user');
      token = null; currentUser = null;
      if (ws) ws.close();
      document.getElementById('app').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('login-pass').value = '';
    }

    function showApp() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('user-display-name').textContent = currentUser.username;
      document.getElementById('user-avatar').textContent = currentUser.username[0].toUpperCase();
    }

    function connectWS() {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => { ws.send(JSON.stringify({ type: 'auth', token })); };
      ws.onmessage = (e) => { handleWS(JSON.parse(e.data)); };
      ws.onclose = () => { setTimeout(connectWS, 3000); };
    }

    function handleWS(data) {
      switch (data.type) {
        case 'auth_ok': break;
        case 'rooms': renderRooms(data.rooms); break;
        case 'online_users': renderOnlineUsers(data.users); break;
        case 'room_history': if (data.roomId === currentRoomId) renderHistory(data.messages); break;
        case 'new_message': if (data.message.room_id === currentRoomId) appendMessage(data.message); break;
        case 'reaction_update': updateReactions(data.messageId, data.reactions); break;
        case 'user_typing': if (data.roomId === currentRoomId && data.username !== currentUser.username) showTyping(data.username); break;
        case 'system': if (data.roomId === currentRoomId) appendSystem(data.message); break;
        case 'error': console.error('ws error:', data.message); break;
      }
    }

    function wsSend(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

    function renderRooms(rooms) {
      const list = document.getElementById('room-list');
      list.innerHTML = '';
      rooms.forEach(r => {
        const el = document.createElement('div');
        el.className = 'room-item' + (r.id === currentRoomId ? ' active' : '');
        el.dataset.id = r.id;
        el.innerHTML = `<span class="room-hash">#</span>${r.name}`;
        el.onclick = () => joinRoom(r.id, r.name);
        list.appendChild(el);
      });
    }

    function joinRoom(roomId, roomName) {
      currentRoomId = roomId;
      document.getElementById('chat-room-title').textContent = roomName;
      document.getElementById('welcome-screen').style.display = 'none';
      document.getElementById('chat-view').style.display = 'flex';
      document.getElementById('messages').innerHTML = '';
      document.querySelectorAll('.room-item').forEach(el => el.classList.toggle('active', parseInt(el.dataset.id) === roomId));
      wsSend({ type: 'join_room', payload: { roomId } });
    }

    function showAddRoom() { document.getElementById('modal-room').classList.add('open'); document.getElementById('new-room-name').focus(); }
    function hideAddRoom() { document.getElementById('modal-room').classList.remove('open'); document.getElementById('new-room-name').value = ''; }

    async function createRoom() {
      const name = document.getElementById('new-room-name').value.trim().toLowerCase().replace(/\s+/g, '-');
      if (!name) return;
      await fetch(`${API}/api/rooms`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ name }) });
      hideAddRoom();
    }

    function renderHistory(messages) {
      const container = document.getElementById('messages');
      container.innerHTML = '';
      messages.forEach(m => appendMessage(m, false));
      scrollBottom();
    }

    function appendMessage(msg, scroll = true) {
      const container = document.getElementById('messages');
      const isSelf = msg.user_id == currentUser.userId || msg.username === currentUser.username;
      const time = new Date(msg.created_at).toLocaleTimeString('fr', { hour: '2-digit', minute: '2-digit' });
      const group = document.createElement('div');
      group.className = 'msg-group';
      group.dataset.msgId = msg.id;
      group.innerHTML = `
        <div class="msg-avatar">${msg.username[0].toUpperCase()}</div>
        <div class="msg-body">
          <div class="msg-meta"><span class="msg-author${isSelf ? ' self' : ''}">${msg.username}</span><span class="msg-time">${time}</span></div>
          <div class="msg-text">${escapeHtml(msg.content)}</div>
          <div class="msg-reactions" id="reactions-${msg.id}">${renderReactionPills(msg.id, msg.reactions || [])}</div>
        </div>
        <div class="msg-actions"><button class="action-btn" onclick="toggleEmojiPicker(event, ${msg.id})" title="réagir">😊</button></div>
      `;
      container.appendChild(group);
      if (scroll) scrollBottom();
    }

    function appendSystem(text) {
      const container = document.getElementById('messages');
      const el = document.createElement('div');
      el.className = 'msg-system';
      el.textContent = text;
      container.appendChild(el);
      scrollBottom();
    }

    function renderReactionPills(msgId, reactions) {
      return reactions.map(r => `<span class="reaction-pill" onclick="sendReaction(${msgId}, '${r.emoji}')">${r.emoji} <span style="font-family:'IBM Plex Mono',monospace;font-size:0.75rem">${r.count}</span></span>`).join('');
    }

    function updateReactions(msgId, reactions) {
      const el = document.getElementById(`reactions-${msgId}`);
      if (el) el.innerHTML = renderReactionPills(msgId, reactions);
    }

    function scrollBottom() { const c = document.getElementById('messages'); c.scrollTop = c.scrollHeight; }

    function sendMessage() {
      const input = document.getElementById('msg-input');
      const content = input.value.trim();
      if (!content || !currentRoomId) return;
      wsSend({ type: 'send_message', payload: { roomId: currentRoomId, content } });
      input.value = '';
      input.style.height = 'auto';
    }

    document.getElementById('msg-input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    document.getElementById('msg-input').addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; if (!currentRoomId) return; wsSend({ type: 'typing', payload: { roomId: currentRoomId } }); });
    document.getElementById('login-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

    let openPickerId = null; let openPickerEl = null;
    function toggleEmojiPicker(e, msgId) {
      e.stopPropagation();
      if (openPickerEl) { openPickerEl.remove(); openPickerEl = null; }
      if (openPickerId === msgId) { openPickerId = null; return; }
      openPickerId = msgId;
      const picker = document.createElement('div');
      picker.className = 'emoji-picker';
      picker.innerHTML = EMOJIS.map(em => `<button onclick="sendReaction(${msgId},'${em}')">${em}</button>`).join('');
      e.currentTarget.closest('.msg-group').appendChild(picker);
      openPickerEl = picker;
    }
    document.addEventListener('click', () => { if (openPickerEl) { openPickerEl.remove(); openPickerEl = null; openPickerId = null; } });
    function sendReaction(msgId, emoji) { if (!currentRoomId) return; wsSend({ type: 'react', payload: { messageId: msgId, emoji, roomId: currentRoomId } }); if (openPickerEl) { openPickerEl.remove(); openPickerEl = null; openPickerId = null; } }

    function showTyping(username) {
      const el = document.getElementById('typing-indicator');
      el.textContent = `${username} est en train d'écrire…`;
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => { el.textContent = ''; }, 2500);
    }

    function renderOnlineUsers(users) {
      document.getElementById('online-count').textContent = users.length;
      document.getElementById('online-badge-count').textContent = users.length;
      const list = document.getElementById('online-list');
      list.innerHTML = users.map(u => `<div class="online-user"><div class="online-avatar">${u.username[0].toUpperCase()}</div>${u.username}</div>`).join('');
    }

    function escapeHtml(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideAddRow(); });
  </script>
</body>
</html>
