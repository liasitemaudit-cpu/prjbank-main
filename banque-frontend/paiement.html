<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NathBank — Paiement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── tokens ── */
    :root {
      --paper: #f7f5f0;
      --ink: #141418;
      --ink-soft: #5a5a66;
      --rule: #d8d4c8;
      --border: #c7c2b5;
      --credit: #2e7d32;
      --max-width: 52ch;
    }

    /* ── reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 17px;
      line-height: 1.55;
      min-height: 100vh;
    }

    /* ── type ── */
    h1 { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 2.2rem; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 0.4em; }
    h2 { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 1.4rem; line-height: 1.25; margin-bottom: 0.5em; }
    p { margin-bottom: 1em; max-width: var(--max-width); }
    small { font-size: 0.85rem; color: var(--ink-soft); }
    code { font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; background: #eaddc4; padding: 0.1em 0.35em; border: 1px solid var(--rule); }
    a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
    a:hover { color: #5a4a2e; }
    a:focus-visible { outline: 2px solid #5a4a2e; outline-offset: 2px; }

    /* ── layout ── */
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 1.5rem; }
    .column { max-width: var(--max-width); }

    /* ── header ── */
    header { border-bottom: 2px solid var(--ink); padding: 1.5rem 0 1rem; margin-bottom: 2rem; }
    header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .brand { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 1.6rem; text-decoration: none; color: var(--ink); }
    nav a { font-size: 0.9rem; text-decoration: none; color: var(--ink-soft); border: 1px solid var(--border); padding: 0.2em 0.55em; }
    nav a:hover { border-color: var(--ink); color: var(--ink); background: #eaddc4; }

    /* ── solde ── */
    .solde { border: 2px solid var(--ink); background: #ffffff; padding: 1.5rem; margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.5rem; }
    .solde-label { font-size: 0.8rem; letter-spacing: 0.08em; color: var(--ink-soft); }
    .solde-montant { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 2rem; line-height: 1; }

    /* ── form ── */
    .card { border: 2px solid var(--ink); background: #ffffff; padding: 2rem; }
    .form { display: flex; flex-direction: column; gap: 1.25rem; }
    .field { display: flex; flex-direction: column; gap: 0.4rem; }
    label { font-size: 0.8rem; letter-spacing: 0.08em; color: var(--ink-soft); }
    input { background: #ffffff; border: 1px solid var(--border); color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 0.95rem; padding: 0.55rem 0.7rem; outline: none; width: 100%; }
    input:focus { border-color: var(--ink); }
    input::placeholder { color: var(--ink-soft); }
    .montant-input { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 1.8rem; padding: 0.6rem 0.7rem; }

    button { background: var(--ink); color: #ffffff; border: none; padding: 0.6rem 1.1rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; letter-spacing: 0.1em; cursor: pointer; }
    button:hover { background: #000; }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--border); }
    button.secondary:hover { background: #eaddc4; border-color: var(--ink); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .message { font-size: 0.85rem; padding: 0.5rem 0.75rem; margin-top: 0.5rem; border: 1px solid var(--border); display: none; }
    .message.show { display: block; }
    .message.success { border-color: var(--credit); background: #f0f6f0; color: var(--credit); }
    .message.error { border-color: #b3261e; background: #f9f0f0; color: #b3261e; }

    /* ── succès ── */
    .succes { display: none; text-align: center; padding: 3rem 1rem; }
    .succes.visible { display: block; }
    .succes-icon { font-family: 'Source Serif 4', serif; font-size: 4rem; color: var(--credit); line-height: 1; margin-bottom: 1rem; }
    .succes-title { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 1.6rem; margin-bottom: 0.5rem; }
    .succes-text { font-size: 0.9rem; color: var(--ink-soft); margin-bottom: 1.5rem; }

    /* ── rules ── */
    .hairline { border: none; border-top: 1px solid var(--rule); margin: 2rem 0; }

    /* ── motion ── */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
    .load-reveal { opacity: 0; animation: fadeIn 0.6s ease forwards; }
    @keyframes fadeIn { to { opacity: 1; } }

    @media (max-width: 600px) { .wrap { padding: 0 1rem; } header { padding: 1rem 0 0.5rem; } .card { padding: 1.5rem 1rem; } }
  </style>
</head>
<body>

  <header>
    <div class="wrap">
      <a href="#" class="brand">NathBank</a>
      <nav>
        <a href="dashboard.html">← retour au tableau de bord</a>
      </nav>
    </div>
  </header>

  <main class="wrap load-reveal">
    <section class="column">
      <h1>effectuer un paiement</h1>
      <p>transfert sécurisé depuis votre compte nathbank vers nathstore.</p>

      <div class="solde">
        <div>
          <div class="solde-label">solde disponible</div>
          <div class="solde-montant"><span id="soldeDisponible">—</span> €</div>
        </div>
      </div>

      <div class="card">
        <div id="formWrapper">
          <form class="form" onsubmit="payer(event)">
            <div class="field">
              <label>description du paiement</label>
              <input type="text" id="description" placeholder="achat sur nathstore" required>
            </div>
            <div class="field">
              <label>montant (€)</label>
              <input type="number" id="montant" placeholder="0.00" min="0.01" step="0.01" class="montant-input" required>
            </div>
            <button type="submit" id="btnPayer">confirmer le paiement</button>
            <div class="message" id="payMsg"></div>
          </form>
        </div>

        <div class="succes" id="successOverlay">
          <div class="succes-icon">✓</div>
          <div class="succes-title">paiement validé</div>
          <div class="succes-text" id="successText">—</div>
          <a href="dashboard.html" class="secondary">retour au tableau de bord</a>
        </div>
      </div>

      <hr class="hairline">
      <p class="small">paiement sécurisé · authentification jwt · le solde est débité immédiatement</p>
    </section>
  </main>

  <script>
    const API = 'http://localhost:3000';
    const token = localStorage.getItem('token');

    if (!token) window.location.href = 'index.html';

    const headers = {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    };

    async function loadSolde() {
      try {
        const res = await fetch(`${API}/api/comptes/solde`, { headers });
        const data = await res.json();
        if (res.ok) {
          document.getElementById('soldeDisponible').textContent = data.solde.toFixed(2);
        }
      } catch {}
    }

    async function payer(e) {
      e.preventDefault();
      const montant = parseFloat(document.getElementById('montant').value);
      const description = document.getElementById('description').value;
      const btn = document.getElementById('btnPayer');

      btn.disabled = true;
      btn.textContent = 'traitement en cours…';

      try {
        const res = await fetch(`${API}/api/transactions/payer`, {
          method: 'POST',
          headers,
          body: JSON.stringify({ montant, description })
        });
        const data = await res.json();

        if (res.ok) {
          document.getElementById('formWrapper').style.display = 'none';
          document.getElementById('successOverlay').classList.add('visible');
          document.getElementById('successText').textContent =
            `${montant.toFixed(2)} € débités · nouveau solde : ${data.nouveau_solde.toFixed(2)} €`;
        } else {
          document.getElementById('payMsg').textContent = data.erreur || 'erreur';
          document.getElementById('payMsg').className = 'message error show';
          btn.disabled = false;
          btn.textContent = 'confirmer le paiement';
        }
      } catch {
        document.getElementById('payMsg').textContent = 'serveur inaccessible';
        document.getElementById('payMsg').className = 'message error show';
        btn.disabled = false;
        btn.textContent = 'confirmer le paiement';
      }
    }

    loadSolde();
  </script>
</body>
</html>
