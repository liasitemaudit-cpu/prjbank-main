<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NathNotes — Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <style>
    /* ── tokens ── */
    :root {
      --paper: #f7f5f0;
      --ink: #141418;
      --ink-soft: #5a5a66;
      --rule: #d8d4c8;
      --border: #c7c2b5;
      --surface: #ffffff;
      --surface2: #f3f1e8;
      --credit: #2e7d32;
      --debit: #b3261e;
    }

    .light { --paper: #f7f5f0; --ink: #141418; }

    /* ── reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 17px;
      line-height: 1.55;
      overflow: hidden;
    }

    /* ── type ── */
    h1 { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 1.5rem; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 0.4em; }
    h2 { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 1.1rem; line-height: 1.25; margin-bottom: 0.5em; }
    p { margin-bottom: 1em; }
    small { font-size: 0.85rem; color: var(--ink-soft); }
    code { font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; background: #eaddc4; padding: 0.1em 0.35em; border: 1px solid var(--rule); }
    a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
    a:hover { color: #5a4a2e; }
    a:focus-visible { outline: 2px solid #5a4a2e; outline-offset: 2px; }

    /* ── layout ── */
    .app { display: none; }
    .app.visible { display: grid; }
    .app {
      grid-template-columns: 260px 280px 1fr;
      height: 100vh;
    }

    /* ── login ── */
    #login-screen {
      position: fixed; inset: 0; background: var(--paper);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    #login-screen.hidden { display: none; }
    .login-box { border: 2px solid var(--ink); background: #ffffff; padding: 2rem; max-width: 400px; width: 90%; }
    .login-box h1 { margin-bottom: 0.25rem; }
    .login-sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 1.5rem; }
    .login-box fieldset { border: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.75rem; }
    .field { display: flex; flex-direction: column; gap: 0.4rem; }
    .field label { font-size: 0.8rem; letter-spacing: 0.08em; color: var(--ink-soft); }
    .field input { background: #ffffff; border: 1px solid var(--border); color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 0.95rem; padding: 0.55rem 0.7rem; outline: none; width: 100%; }
    .field input:focus { border-color: var(--ink); }
    button { background: var(--ink); color: #ffffff; border: none; padding: 0.6rem 1rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; letter-spacing: 0.1em; cursor: pointer; margin-top: 0.5rem; }
    button:hover { background: #000; }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--border); }
    button.secondary:hover { background: #eaddc4; border-color: var(--ink); }
    .message { font-size: 0.85rem; padding: 0.5rem 0.75rem; margin-top: 0.5rem; border: 1px solid var(--border); display: none; }
    .message.show { display: block; }
    .message.error { border-color: #b3261e; background: #f9f0f0; color: #b3261e; }
    .toggle-mode { font-size: 0.85rem; color: var(--ink-soft); margin-top: 1rem; text-align: center; }
    .toggle-mode a { color: var(--ink); text-decoration: underline; }

    /* ── sidebar ── */
    .sidebar { background: var(--surface); border-right: 1px solid var(--rule); display: flex; flex-direction: column; padding: 1.25rem; overflow-y: auto; }
    .sidebar-head { margin-bottom: 1rem; }
    .sidebar-head h1 { font-size: 1.25rem; margin-bottom: 0.25rem; }
    .user-info { border: 1px solid var(--rule); padding: 0.75rem; margin-bottom: 1rem; border-radius: 0; }
    .user-name { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 1rem; }
    .user-email { font-size: 0.8rem; color: var(--ink-soft); }
    .actions { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
    .actions button { display: flex; align-items: center; gap: 0.5rem; justify-content: flex-start; width: 100%; text-align: left; padding: 0.55rem 0.75rem; }
    .actions button.primary { background: var(--ink); color: #ffffff; }
    .actions button.primary:hover { background: #000; }
    .folders { margin-top: auto; border-top: 1px solid var(--rule); padding-top: 0.75rem; }
    .folders-title { font-size: 0.8rem; letter-spacing: 0.08em; color: var(--ink-soft); margin-bottom: 0.5rem; }
    .folder-list { display: flex; flex-direction: column; gap: 0.25rem; }
    .folder-item { padding: 0.45rem 0.6rem; border: 1px solid var(--border); cursor: pointer; }
    .folder-item:hover { background: var(--surface2); border-color: var(--ink); }
    .folder-item.active { background: #eaddc4; border-color: var(--ink); font-weight: 600; }
    .folder-item:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .folder-item emoji { margin-right: 0.5rem; }

    /* ── notes list ── */
    .notes-list { background: var(--surface2); border-right: 1px solid var(--rule); display: flex; flex-direction: column; }
    .notes-head { padding: 0.75rem 1rem; border-bottom: 1px solid var(--rule); }
    .search { border: 1px solid var(--border); padding: 0.45rem 0.7rem; width: 100%; font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; background: #ffffff; color: var(--ink); outline: none; }
    .search:focus { border-color: var(--ink); }
    .notes-items { flex: 1; overflow-y: auto; padding: 0.5rem; }
    .note-item { padding: 0.75rem; border: 1px solid var(--border); cursor: pointer; margin-bottom: 0.4rem; }
    .note-item:hover { background: var(--surface2); border-color: var(--ink); }
    .note-item.active { background: #eaddc4; border-color: var(--ink); font-weight: 600; }
    .note-item:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .note-title { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 0.95rem; margin-bottom: 0.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .note-preview { font-size: 0.8rem; color: var(--ink-soft); line-height: 1.5; }
    .note-date { font-size: 0.7rem; color: var(--ink-soft); margin-top: 0.4rem; font-family: 'IBM Plex Mono', monospace; }
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--ink-soft); text-align: center; padding: 2rem; }

    /* ── editor ── */
    .editor { background: var(--surface); display: flex; flex-direction: column; }
    .editor-head { padding: 0.75rem 1rem; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; }
    .editor-title-input { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 1.25rem; background: transparent; border: none; color: var(--ink); outline: none; width: 100%; }
    .editor-meta { font-size: 0.75rem; color: var(--ink-soft); display: flex; align-items: center; gap: 0.5rem; }
    .editor-body { flex: 1; padding: 1rem; overflow-y: auto; }
    .editor-content { font-family: 'IBM Plex Mono', monospace; font-size: 1rem; line-height: 1.8; color: var(--ink); min-height: 100%; outline: none; white-space: pre-wrap; }
    .editor-content:empty::before { content: 'commencez à écrire…'; color: var(--ink-soft); }
    .editor-actions { display: flex; align-items: center; gap: 0.5rem; }
    .icon-btn { background: none; border: 1px solid var(--border); color: var(--ink-soft); width: 28px; height: 28px; border-radius: 0; cursor: pointer; font-size: 1rem; }
    .icon-btn:hover { border-color: var(--ink); color: var(--ink); }
    .icon-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    /* ── scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); }

    @media (max-width: 900px) { .app { grid-template-columns: 220px 1fr; } .notes-list { display: none; } }
    @media (max-width: 600px) { .app { grid-template-columns: 1fr; } .sidebar { display: none; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>

  <!-- login -->
  <div id="login-screen">
    <div class="login-box">
      <h1>NathNotes</h1>
      <div class="login-sub">connectez-vous pour accéder à vos notes</div>
      <div id="login-form">
        <fieldset>
          <div class="field">
            <label>email</label>
            <input type="email" id="email" placeholder="nathanael@straumann.me">
          </div>
          <div class="field">
            <label>mot de passe</label>
            <input type="password" id="password" placeholder="••••••••">
          </div>
          <div class="field" id="name-field" style="display:none">
            <label>nom (inscription uniquement)</label>
            <input type="text" id="name" placeholder="nathanael straumann">
          </div>
        </fieldset>
        <button type="button" id="login-btn" onclick="handleLogin()">se connecter</button>
        <div class="message error" id="login-error"></div>
      </div>
      <div class="toggle-mode">
        <span id="toggle-text">pas encore de compte ?</span>
        <a id="toggle-link" onclick="toggleMode()">s'inscrire</a>
      </div>
    </div>
  </div>

  <!-- app -->
  <div class="app" id="app">
    <!-- sidebar -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <h1>NathNotes</h1>
      </div>
      <div class="user-info">
        <div class="user-name" id="userName">—</div>
        <div class="user-email" id="userEmail">—</div>
      </div>
      <div class="actions">
        <button type="button" class="primary" onclick="createNote()"><span>+</span> nouvelle note</button>
        <button type="button" onclick="showAllNotes()"><span>📋</span> toutes les notes</button>
        <button type="button" onclick="showFavorites()"><span>⭐</span> favoris</button>
        <button type="button" onclick="showTrash()"><span>🗑️</span> corbeille</button>
        <button type="button" class="secondary" onclick="logout()"><span>🚪</span> déconnexion</button>
        <a href="help.html" class="secondary" style="text-decoration:none;display:flex;align-items:center;gap:0.5rem;justify-content:flex-start;padding:0.55rem 0.75rem;"><span>📖</span> aide / api</a>
      </div>
      <div class="folders">
        <div class="folders-title">dossiers</div>
        <div class="folder-list" id="folderList"></div>
        <button type="button" class="secondary" style="width:100%;text-align:left;" onclick="createFolder()"><span>+</span> nouveau dossier</button>
      </div>
    </aside>

    <!-- notes list -->
    <section class="notes-list">
      <div class="notes-head">
        <input type="text" class="search" placeholder="rechercher…" id="searchInput" oninput="searchNotes()">
      </div>
      <div class="notes-items" id="notesItems">
        <div class="empty-state">
          <div style="font-size:3rem;margin-bottom:1rem;">📝</div>
          <div style="font-family:'Source Serif 4',serif;font-weight:600;font-size:1.1rem;margin-bottom:0.4rem;">sélectionnez une note</div>
          <div style="font-size:0.9rem;">choisissez une note dans la liste ou créez-en une nouvelle</div>
        </div>
      </div>
    </section>

    <!-- editor -->
    <main class="editor" id="editor">
      <div class="editor-head">
        <input type="text" class="editor-title-input" id="noteTitle" placeholder="titre de la note" oninput="saveNote()">
        <div class="editor-meta">
          <span id="noteDate">modifié aujourd'hui</span>
          <span id="saveIndicator" style="color:var(--credit);"></span>
          <div class="editor-actions">
            <button class="icon-btn" onclick="toggleFavorite()" title="favoris">⭐</button>
            <button class="icon-btn" onclick="deleteNote()" title="supprimer">🗑️</button>
          </div>
        </div>
      </div>
      <div class="editor-body">
        <div class="editor-content" id="noteContent" contenteditable="true" oninput="saveNote()"></div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = 'http://localhost:3001/api';

    let token = localStorage.getItem('nathnotes_token');
    let user = JSON.parse(localStorage.getItem('nathnotes_user') || 'null');
    let notes = [];
    let folders = [];
    let currentNote = null;
    let currentFolder = 'all';
    let isRegisterMode = false;
    let saveTimeout = null;

    async function init() {
      if (token && user) {
        showApp();
      }
    }

    function toggleMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('name-field').style.display = isRegisterMode ? 'block' : 'none';
      document.getElementById('login-btn').textContent = isRegisterMode ? "s'inscrire" : 'se connecter';
      document.getElementById('toggle-text').textContent = isRegisterMode ? 'déjà un compte ?' : 'pas encore de compte ?';
      document.getElementById('toggle-link').textContent = isRegisterMode ? 'se connecter' : "s'inscrire";
      document.getElementById('login-error').style.display = 'none';
    }

    async function handleLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const name = document.getElementById('name').value;
      const errorEl = document.getElementById('login-error');

      const endpoint = isRegisterMode ? '/auth/register' : '/auth/login';
      const body = isRegisterMode ? { email, password, name } : { email, password };

      try {
        const res = await fetch(API_URL + endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          credentials: 'include'
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || 'erreur';
          errorEl.style.display = 'block';
          return;
        }
        token = data.token;
        user = data.user;
        localStorage.setItem('nathnotes_token', token);
        localStorage.setItem('nathnotes_user', JSON.stringify(user));
        showApp();
      } catch (err) {
        errorEl.textContent = 'erreur de connexion';
        errorEl.style.display = 'block';
      }
    }

    function logout() {
      token = null;
      user = null;
      localStorage.removeItem('nathnotes_token');
      localStorage.removeItem('nathnotes_user');
      fetch(API_URL + '/auth/logout', { method: 'POST', credentials: 'include' }).finally(() => {
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('app').classList.remove('visible');
      });
    }

    function showApp() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app').classList.add('visible');
      document.getElementById('userName').textContent = user.name;
      document.getElementById('userEmail').textContent = user.email;
      loadFolders();
      loadNotes();
    }

    async function apiCall(endpoint, options = {}) {
      const res = await fetch(API_URL + endpoint, {
        ...options,
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
          ...options.headers
        }
      });
      if (res.status === 401) { logout(); return null; }
      return res.json();
    }

    async function loadFolders() {
      folders = (await apiCall('/folders')) || [];
      renderFolders();
    }

    function renderFolders() {
      const container = document.getElementById('folderList');
      container.innerHTML = folders.map(folder => `
        <div class="folder-item ${currentFolder === folder.id ? 'active' : ''}" onclick="selectFolder('${folder.id}')" tabindex="0">
          <span style="margin-right:0.5rem">${folder.icon}</span>${folder.name}
        </div>
      `).join('');
    }

    async function loadNotes() {
      notes = (await apiCall('/notes')) || [];
      renderNotesList();
    }

    function renderNotesList() {
      const container = document.getElementById('notesItems');
      let filtered = notes;
      if (currentFolder !== 'all') filtered = filtered.filter(n => n.folder === currentFolder);
      const search = document.getElementById('searchInput').value.toLowerCase();
      if (search) {
        filtered = filtered.filter(n => (n.title || '').toLowerCase().includes(search) || (n.content || '').toLowerCase().includes(search));
      }
      if (!filtered.length) {
        container.innerHTML = '<div class="empty-state"><div style="font-size:2rem;margin-bottom:0.5rem;">📭</div><div style="font-family:\'Source Serif 4\',serif;font-weight:600;font-size:1rem;">aucune note</div></div>';
        return;
      }
      container.innerHTML = filtered.map(note => `
        <div class="note-item ${currentNote?.id === note.id ? 'active' : ''}" onclick="openNote(${note.id})" tabindex="0">
          <div class="note-title">${note.title || 'sans titre'}</div>
          <div class="note-preview">${(note.content || '').replace(/<[^>]*>/g,'').substring(0, 80)}</div>
          <div class="note-date">${formatDate(note.updated_at)}</div>
        </div>
      `).join('');
    }

    function openNote(id) {
      currentNote = notes.find(n => n.id === id);
      const editor = document.getElementById('editor');
      document.getElementById('noteTitle').value = currentNote.title || '';
      document.getElementById('noteContent').innerHTML = currentNote.content || '';
      document.getElementById('noteDate').textContent = 'modifié ' + formatDate(currentNote.updated_at);
      renderNotesList();
    }

    async function createNote() {
      const note = await apiCall('/notes', {
        method: 'POST',
        body: JSON.stringify({ title: '', content: '', folder: currentFolder === 'all' ? 'all' : currentFolder })
      });
      notes.unshift(note);
      renderNotesList();
      openNote(note.id);
      document.getElementById('noteTitle').focus();
    }

    async function saveNote() {
      if (!currentNote) return;
      if (saveTimeout) clearTimeout(saveTimeout);
      saveTimeout = setTimeout(async () => {
        const title = document.getElementById('noteTitle').value;
        const content = DOMPurify.sanitize(document.getElementById('noteContent').innerHTML);
        await apiCall(`/notes/${currentNote.id}`, { method: 'PUT', body: JSON.stringify({ title, content }) });
        currentNote.title = title;
        currentNote.content = content;
        const saveIndicator = document.getElementById('saveIndicator');
        if (saveIndicator) {
          saveIndicator.textContent = 'enregistré ✓';
          setTimeout(() => { saveIndicator.textContent = ''; }, 2000);
        }
      }, 500);
    }

    async function deleteNote() {
      if (!currentNote) return;
      if (!confirm('supprimer cette note ?')) return;
      await apiCall(`/notes/${currentNote.id}`, { method: 'DELETE' });
      notes = notes.filter(n => n.id !== currentNote.id);
      currentNote = null;
      renderNotesList();
    }

    async function toggleFavorite() {
      if (!currentNote) return;
      const newFav = currentNote.favorite ? 0 : 1;
      await apiCall(`/notes/${currentNote.id}`, { method: 'PUT', body: JSON.stringify({ favorite: newFav }) });
      currentNote.favorite = newFav;
    }

    function searchNotes() { renderNotesList(); }

    function selectFolder(folder) {
      currentFolder = folder;
      renderFolders();
      renderNotesList();
    }

    function showAllNotes() {
      currentFolder = 'all';
      loadNotes();
    }

    function showFavorites() {
      const favs = notes.filter(n => n.favorite);
      const container = document.getElementById('notesItems');
      if (!favs.length) { container.innerHTML = '<div class="empty-state"><div style="font-size:2rem;margin-bottom:0.5rem;">⭐</div><div style="font-family:\'Source Serif 4\',serif;font-weight:600;font-size:1rem;">aucun favori</div></div>'; return; }
      container.innerHTML = favs.map(note => `
        <div class="note-item ${currentNote?.id === note.id ? 'active' : ''}" onclick="openNote(${note.id})" tabindex="0">
          <div class="note-title">⭐ ${note.title || 'sans titre'}</div>
          <div class="note-preview">${(note.content || '').replace(/<[^>]*>/g,'').substring(0, 80)}</div>
        </div>
      `).join('');
    }

    function showTrash() {
      const container = document.getElementById('notesItems');
      const trash = notes.filter(n => n.deleted === 1 || n.deleted === '1');
      if (!trash.length) {
        container.innerHTML = '<div class="empty-state"><div style="font-size:2rem;margin-bottom:0.5rem;">🗑️</div><div style="font-family:\'Source Serif 4\',serif;font-weight:600;font-size:1rem;">corbeille vide</div></div>';
        return;
      }
      container.innerHTML = trash.map(note => `
        <div class="note-item ${currentNote?.id === note.id ? 'active' : ''}" onclick="openNote(${note.id})" tabindex="0">
          <div class="note-title">🗑️ ${note.title || 'sans titre'}</div>
          <div class="note-preview">${(note.content || '').replace(/<[^>]*>/g,'').substring(0, 80)}</div>
          <div class="note-date">${formatDate(note.updated_at)}</div>
          <button type="button" style="margin-top:0.5rem;padding:0.4rem 0.8rem;font-size:0.8rem;background:var(--ink);color:#ffffff;border:none;cursor:pointer;" onclick="event.stopRestore || (event.stopPropagation(), restoreNote(${note.id}))">restaurer</button>
          <button type="button" style="margin-top:0.5rem;margin-left:0.5rem;padding:0.4rem 0.8rem;font-size:0.8rem;background:#b3261e;color:#ffffff;border:none;cursor:pointer;" onclick="event.stopPropagation(), supprimerPermanent(${note.id})">supprimer définitivement</button>
        </div>
      `).join('');
    }

    async function supprimerPermanent(id) {
      if (!confirm('Supprimer définitivement cette note ?')) return;
      await apiCall(`/notes/${id}/permanent`, { method: 'DELETE' });
      loadNotes();
      renderNotesList();
    }

    async function restoreNote(id) {
      await apiCall(`/notes/${id}/restore`, { method: 'POST' });
      loadNotes();
      renderNotesList();
    }

    async function createFolder() {
      const name = prompt('nom du nouveau dossier');
      if (!name) return;
      const folder = await apiCall('/folders', { method: 'POST', body: JSON.stringify({ name }) });
      if (folder) { folders.push(folder); renderFolders(); }
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleDateString('fr', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    init();
  </script>
</body>
</html>
